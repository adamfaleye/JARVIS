<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
:root{--bg:#faf7f4;--card:#fff;--ink:#1f1a17;--muted:#6f655e;--line:#e8e0d8;--accent:#8e3b5e;--accent-2:#f6e9ef;--ok:#2f7d4f;--ok-2:#e6f4ea;
--warn:#a86a00;--warn-2:#fff3dc;--bad:#b3261e;--bad-2:#fde8e6;--info:#2b5ea7;--info-2:#e7effa;--r:12px}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px}
button:hover{border-color:#cdbfb3}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.07)}button.danger{color:var(--bad);border-color:#efc6c2}button.ghost{background:transparent;border-color:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:700;letter-spacing:.2px}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav button{border:none;background:none;padding:8px 12px;border-radius:8px;color:var(--muted)}
nav button.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#f1ece7;color:var(--muted);white-space:nowrap}
.b-ok{background:var(--ok-2);color:var(--ok)}.b-warn{background:var(--warn-2);color:var(--warn)}.b-bad{background:var(--bad-2);color:var(--bad)}
.b-info{background:var(--info-2);color:var(--info)}.b-acc{background:var(--accent-2);color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--warn-2);color:#6b4500}.banner.bad{background:var(--bad-2);color:#7d1a14}.banner.info{background:var(--info-2);color:#1f4479}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.req{cursor:pointer;transition:box-shadow .15s}.req:hover{box-shadow:0 3px 14px rgba(60,30,20,.08)}
.req .who{font-weight:600}.req .svc{margin:6px 0 2px}.req .when{font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.kpi .card b{display:block;font-size:24px}
.overlay{position:fixed;inset:0;background:rgba(30,20,15,.35);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;padding:18px 20px 80px;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 14px}.steps span{font-size:11.5px;padding:3px 8px;border-radius:99px;background:#efe8e1;color:#8b8079}
.steps span.done{background:var(--ok-2);color:var(--ok)}.steps span.now{background:var(--accent);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.two{grid-template-columns:1fr}header{flex-wrap:wrap;padding:10px 14px}nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto}nav button{white-space:nowrap}main{padding:14px}}
.actions{padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.box.accent{border-color:#e3c4d2;background:#fffafc}
.inbox{display:grid;grid-template-columns:320px 1fr;gap:12px;min-height:70vh}@media(max-width:800px){.inbox{grid-template-columns:1fr}}
.convs{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:78vh}
.conv{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}.conv.on{background:var(--accent-2)}.conv:hover{background:#fbf6f2}
.thread{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:78vh}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.in{background:#f1ece7;align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:var(--accent-2);align-self:flex-end;border-bottom-right-radius:4px}
.msg.out.pending{background:#fff;border:1.5px dashed #d7a9bd}.msg.out.blocked{background:#fff;border:1.5px dashed #e3a39d}
.msg .meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.compose{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}.compose textarea{min-height:44px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}th{background:#fbf8f5;color:var(--muted);font-weight:600;font-size:13px}
tr.click{cursor:pointer}tr.click:hover td{background:#fcf8f5}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b2320;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90%}
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.switch:last-child{border-bottom:none}
.switch .t{flex:1}.switch .t b{display:block;font-weight:600}.copy{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#fbf8f5;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap}
.photos{display:flex;gap:8px;flex-wrap:wrap}.photos a{font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script nonce="{{NONCE}}">
"use strict";
const S = {me:null, csrf:"", view:"requests", queue:null, convId:null, labels:{}, settings:{}, timer:null, kbData:null};
let P = {owner:"the owner", owner_possessive:"the owner's", calendar:"your calendar", brand:"", subtitle:"", notes_label:"Notes", booking_noun:"appointment",
  requests_label:"Requests", baseline_hint:"", calendar_note:""};
const B = {brand:"Assistant"};
function T(str){
  if (typeof str!=="string" || str.indexOf("{")<0) return str;
  const noun=P.booking_noun||"appointment";
  const m={owner:P.owner, owner_s:P.owner_possessive, cal:P.calendar, brand:P.brand||B.brand, subtitle:P.subtitle||"", notes_label:P.notes_label,
    noun:noun, Noun:noun.charAt(0).toUpperCase()+noun.slice(1), requests_label:P.requests_label, baseline_hint:P.baseline_hint||"", calendar_note:P.calendar_note||""};
  return str.replace(/\{(\w+)\}/g,(all,k)=>Object.prototype.hasOwnProperty.call(m,k)?String(m[k]):all);
}
const $ = (sel, root=document) => root.querySelector(sel);
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v===null||v===undefined||v===false) continue;
    if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k==="html") {} else e.setAttribute(k, v===true?"":(typeof v==="string"&&k!=="value"&&k!=="href"?T(v):v));
  }
  for (const k of kids.flat()) if (k!==null && k!==undefined && k!==false) e.append(k instanceof Node ? k : document.createTextNode(T(String(k))));
  return e;
}
function prompt_T(a,b){ return window.prompt(T(a), b===undefined?undefined:b); }
function toast(t){ const d=el("div",{class:"toast"},T(t)); document.body.append(d); setTimeout(()=>d.remove(), 3800); }
async function api(path, body){
  const opt = body===undefined ? {credentials:"same-origin"} : {method:"POST", credentials:"same-origin",
    headers:{"Content-Type":"application/json","X-CSRF":S.csrf}, body:JSON.stringify(body)};
  const r = await fetch(path, opt); let j={}; try{ j=await r.json(); }catch(e){}
  if (r.status===401 && j.code==="signin"){ S.me=null; renderLogin(); throw new Error("Signed out"); }
  if (!r.ok) throw new Error(j.error || ("Error "+r.status));
  return j;
}
async function act(path, body, okMsg){ try{ const r=await api(path, body); if(okMsg) toast(okMsg); return r; }catch(e){ toast(e.message); throw e; } }
const ago = ts => { if(!ts) return ""; const s=(Date.now()-new Date(ts))/1000; if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; };
const fmtTime = ts => ts ? new Date(ts).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const STATUS_CLASS = {AWAITING_AVAILABILITY:"b-warn",DRAFT_CREATED:"b-warn",READY_FOR_OWNER:"b-acc",OWNER_REVIEWING:"b-acc",INFORMATION_NEEDED:"b-info",
  APPROVED:"b-ok",AWAITING_CALENDAR_ENTRY:"b-ok",ENTERED_IN_CALENDAR:"b-ok",CONFIRMED:"b-ok",COMPLETED:"",DECLINED:"b-bad",CANCELLED:"b-bad",NEW_INQUIRY:"",QUALIFYING:""};
const badge = (t, c="") => el("span",{class:"badge "+c}, t);
const isOwner = () => S.me && S.me.role==="owner";

// ------------------------------------------------------------------ shell
async function boot(){
  try{ const b=await (await fetch("/api/brand",{credentials:"same-origin"})).json(); B.brand=b.brand||B.brand; document.title=B.brand+" · Assistant"; }catch(e){}
  try{ const j=await api("/api/me"); S.me=j.user; S.csrf=j.csrf; S.labels=j.labels; S.settings=j.settings; P=Object.assign(P, j.profile||{}); S.hasOperator=j.has_operator; render(); }
  catch(e){ renderLogin(); }
}
function renderLogin(){
  clearInterval(S.timer);
  const u=el("input",{autocomplete:"username"}), p=el("input",{type:"password",autocomplete:"current-password"}), msg=el("div",{class:"small",style:"color:var(--bad);min-height:20px;margin-top:8px"});
  const go=async ev=>{ ev.preventDefault(); try{ const j=await api("/api/login",{username:u.value,password:p.value}); S.csrf=j.csrf; await boot(); }catch(e){ msg.textContent=e.message; } };
  $("#app").replaceChildren(el("form",{class:"login",onsubmit:go}, el("div",{class:"brand",style:"font-size:20px"},B.brand,el("small",{},"Instagram assistant · AI Sidekicks")),
    el("label",{},"Username"),u,el("label",{},"Password"),p, el("div",{style:"margin-top:16px"}, el("button",{class:"primary",type:"submit",style:"width:100%"},"Sign in")), msg));
  u.focus();
}
const VIEWS=[["requests","{requests_label}"],["inbox","Instagram Inbox"],["customers","Customers"],["kb","Knowledge Base"],["analytics","Analytics"],["settings","Settings"]];
function render(){
  const nav=el("nav",{}, VIEWS.map(([k,l])=>el("button",{class:S.view===k?"on":"",onclick:()=>{S.view=k; render();}}, l, k==="requests"&&S.queue&&S.queue.attention?" ("+S.queue.attention+")":"")));
  const who=el("div",{class:"row small"}, el("span",{class:"muted"}, S.me.name+(S.me.role==="operator"?" · AI Sidekicks":"")), el("button",{class:"ghost",onclick:async()=>{await api("/api/logout",{}); renderLogin();}},"Sign out"));
  const main=el("main",{id:"main"});
  $("#app").replaceChildren(el("header",{}, el("div",{class:"brand"},"{brand}",el("small",{},"{subtitle}")), nav, who), main);
  banners(main);
  const v={requests:viewRequests, inbox:viewInbox, customers:viewCustomers, kb:viewKB, analytics:viewAnalytics, settings:viewSettings}[S.view];
  const box=el("div",{id:"view"}); main.append(box); v(box);
  clearInterval(S.timer);
  S.timer=setInterval(()=>{ if(document.hidden||$(".overlay")) return; if(S.view==="requests") viewRequests($("#view")); if(S.view==="inbox") refreshInbox(); }, S.view==="inbox"?5000:10000);
}
function banners(main){
  const st=S.settings||{};
  if (st.automation_paused==="1") main.append(el("div",{class:"banner bad"},"AI automation is paused. Messages are still collected; the assistant isn't replying. Resume it in Settings."));
  if (st.live_send!=="1") main.append(el("div",{class:"banner warn"},"Test mode: nothing is sent to Instagram until the pilot starts. Replies show here as held or test messages."));
}

// ------------------------------------------------------------------ Appointment Requests (primary view)
async function viewRequests(box){
  if(!box) return;
  let q; try{ q=await api("/api/queue"); }catch(e){ return; }
  S.queue=q;
  const navBtn=document.querySelector("nav button"); if(navBtn) navBtn.textContent=T("{requests_label}")+(q.attention?" ("+q.attention+")":"");
  const parts=[el("h1",{}, q.attention ? `${q.attention} request${q.attention>1?"s":""} need${q.attention>1?"":"s"} your attention` : "You're all caught up")];
  if(!q.attention) parts.push(el("p",{class:"muted"},"New appointment drafts from Instagram show up here. Nothing is booked until you approve it and confirm it in {cal}."));
  for (const g of q.groups){
    if (!g.items.length && ["qualifying","info_needed"].includes(g.key)) continue;
    parts.push(el("h2",{}, g.label, badge(g.items.length)));
    if (!g.items.length){ parts.push(el("div",{class:"empty"},"Nothing here.")); continue; }
    parts.push(el("div",{class:"grid"}, g.items.map(card)));
  }
  box.replaceChildren(...parts);
}
function card(a){
  const f=a.fields, c=a.customer||{};
  const when=[f.preferred_date, f.preferred_time].filter(Boolean).join(" · ");
  return el("div",{class:"card req",onclick:()=>openAppt(a.id)},
    el("div",{class:"row"}, el("span",{class:"who grow"}, f.customer_name||c.name||"Name not given yet"), a.is_test?badge("Test",""):null, badge(a.status_label, STATUS_CLASS[a.status])),
    el("div",{class:"small muted"}, f.instagram_username||("@"+(c.username||"unknown"))),
    el("div",{class:"svc"}, (a.service.label||"Service not chosen")+(a.service.price?" · "+a.service.price:"")),
    el("div",{class:"when"}, when||el("span",{class:"muted"},"No date yet"), f.alt_date?el("span",{class:"muted"}," (backup "+f.alt_date+(f.alt_time?", "+f.alt_time:"")+")"):null),
    el("div",{class:"chips"},
      ["NEW_INQUIRY","QUALIFYING"].includes(a.status)?null:badge(a.availability==="verified"?"Availability verified":"Availability: awaiting your check", a.availability==="verified"?"b-ok":"b-warn"),
      (a.missing||[]).map(m=>badge("Missing: "+({customer_name:"name",service:"service",preferred_date:"date",preferred_time:"time",photos:"photos"}[m]||m),"b-info")),
      a.escalation_reason?badge(a.escalation_reason,"b-bad"):null,
      el("span",{class:"small muted",style:"margin-left:auto"}, ago(a.draft_created_at||a.created_at))));
}
const PATH=["DRAFT_CREATED","AWAITING_AVAILABILITY","READY_FOR_OWNER","APPROVED","AWAITING_CALENDAR_ENTRY","ENTERED_IN_CALENDAR","CONFIRMED"];
async function openAppt(id){
  let a; try{ a=await api(`/api/appointments/${id}?review=1`); }catch(e){ return toast(e.message); }
  const close=()=>{ ov.remove(); if(S.view==="requests") viewRequests($("#view")); };
  const ov=el("div",{class:"overlay",onclick:e=>{ if(e.target===ov) close(); }});
  const d=el("div",{class:"drawer"}); ov.append(d); document.body.append(ov);
  const reload=async()=>{ ov.remove(); await openAppt(id); };
  const post=async(action, body, msg)=>{ try{ await api(`/api/appointments/${id}/${action}`, {version:a.version, ...body}); toast(msg); await reload(); }catch(e){ toast(e.message); if(String(e.message).includes("changed")) await reload(); } };
  const f=a.fields, idx=PATH.indexOf(a.status==="OWNER_REVIEWING"?"READY_FOR_OWNER":a.status);
  d.append(el("div",{class:"row"}, el("h1",{class:"grow",style:"margin:0"}, f.customer_name||"Appointment request"), el("button",{onclick:close},"Close")),
    el("div",{class:"row small muted",style:"margin-top:4px"}, badge(a.status_label, STATUS_CLASS[a.status]), a.kind==="consultation"?badge("Consultation","b-acc"):null, a.is_test?badge("Test conversation"):null,
      el("span",{}, "Request #"+a.id+" · created "+fmtTime(a.created_at))),
    el("div",{class:"steps"}, PATH.map((s,i)=>el("span",{class: i<idx?"done":(i===idx?"now":"")}, S.labels[s]||s))));
  if (a.status==="APPROVED"||a.status==="AWAITING_CALENDAR_ENTRY") d.append(el("div",{class:"banner info"},"Approved, but not booked yet. Enter it in {cal}, then record the entry here."));
  if (a.escalation_reason) d.append(el("div",{class:"banner bad"},"Flagged: "+a.escalation_reason));
  const acts=el("div",{class:"actions"}); d.append(acts);
  // ---- details (editable before entry into {cal})
  const editable=["NEW_INQUIRY","QUALIFYING","DRAFT_CREATED","AWAITING_AVAILABILITY","READY_FOR_OWNER","OWNER_REVIEWING","INFORMATION_NEEDED","APPROVED","AWAITING_CALENDAR_ENTRY"].includes(a.status);
  const inp={}; const field=(k,label,type="text")=>{ inp[k]=el(type==="textarea"?"textarea":"input",{value:f[k]||"",disabled:!editable}); if(type==="textarea") inp[k].value=f[k]||""; return el("div",{}, el("label",{},label), inp[k]); };
  const svcSel=el("select",{disabled:!editable}, el("option",{value:""},"Choose…"));
  let kbs; try{ kbs=(await api("/api/kb")).items.service; }catch(e){ kbs={}; }
  for (const [k,s] of Object.entries(kbs)) svcSel.append(el("option",{value:k,selected:f.service_key===k}, s.label+(s.consultation?" (consultation)":" · $"+(s.price_cents/100))));
  inp.service_key=svcSel;
  d.append(el("h3",{},"Customer"), el("div",{class:"two"}, field("customer_name","Name"), el("div",{}, el("label",{},"Instagram"), el("input",{value:f.instagram_username||"",disabled:true})),
      field("contact","Contact (only if the customer offered it)")),
    el("h3",{},"{Noun}"), el("div",{class:"two"}, el("div",{}, el("label",{},"Service"), svcSel),
      el("div",{}, el("label",{},"Price"), el("input",{value:(a.service.price||"—")+(a.service.price_is_override?" (your exception)":""),disabled:true})),
      field("preferred_date","Preferred date"), field("preferred_time","Preferred time"), field("alt_date","Backup date"), field("alt_time","Backup time")),
    el("div",{class:"small muted",style:"margin-top:6px"}, "Duration: "+a.service.duration+(a.service.duration_verified?"":" (add durations in the Knowledge Base)")),
    field("needs","{notes_label}","textarea"), field("notes","Customer requests / notes","textarea"));
  if (isOwner()) d.append(el("details",{}, el("summary",{class:"small muted",style:"margin-top:10px;cursor:pointer"},"Pricing exception (only you can set this)"),
      el("div",{class:"two"}, field("price_override_text","Exception price (e.g. $150)"), field("price_override_reason","Reason"))));
  if (editable) d.append(el("div",{class:"row",style:"margin-top:10px"}, el("button",{onclick:()=>{ const out={}; for(const k in inp) out[k]=inp[k].value; post("edit",{fields:out},"Saved"); }},"Save changes"),
    el("span",{class:"small muted"}, a.status==="APPROVED"||a.status==="AWAITING_CALENDAR_ENTRY"?"Changing the booking details after approval voids the approval.":"")));
  // ---- context
  const ctx=el("div",{class:"box"}, el("b",{},"AI summary"), el("div",{}, a.summary||"—"),
    el("div",{class:"small muted",style:"margin-top:6px"}, "AI confidence: "+(a.confidence!=null?Math.round(a.confidence*100)+"%":"—")),
    a.missing.length?el("div",{class:"chips"}, a.missing.map(m=>badge("Missing: "+m.replace("_"," "),"b-info"))):null,
    a.questions.length?el("div",{class:"small",style:"margin-top:6px"},"Questions you asked: "+a.questions.join(" · ")):null);
  if ((f.photos||[]).length) ctx.append(el("div",{class:"photos",style:"margin-top:8px"}, f.photos.map((u,i)=>el("a",{href:u,target:"_blank",rel:"noopener noreferrer"},"Photo "+(i+1)))));
  d.append(el("h3",{},"Context"), ctx);
  d.append(el("details",{}, el("summary",{class:"small muted",style:"margin-top:10px;cursor:pointer"},"Conversation ("+a.messages.length+" messages)"),
    el("div",{class:"box"}, a.messages.map(m=>el("div",{class:"small",style:"margin:4px 0"}, el("b",{}, m.direction==="in"?"Customer: ":(m.author==="owner"?"You: ":"Assistant: ")), m.text||"", m.direction==="out"?el("span",{class:"muted"}," ["+m.status+"]"):null)))));
  // ---- actions for the current step
  const st=a.status;
  if (!isOwner()) acts.append(el("div",{class:"banner info"},"Only {owner} can verify availability, approve or confirm appointments."));
  else if (["DRAFT_CREATED","AWAITING_AVAILABILITY","READY_FOR_OWNER","OWNER_REVIEWING"].includes(st)){
    const dt=el("input",{value:(a.verified_slot||[])[0]||f.preferred_date||""}), tm=el("input",{value:(a.verified_slot||[])[1]||f.preferred_time||""});
    const box=el("div",{class:"box accent"}, el("b",{}, a.availability==="verified"?"✓ Availability verified: "+a.verified_slot.join(" at "):"1. Check {cal}"),
