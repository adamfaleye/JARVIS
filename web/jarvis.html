<title>JARVIS · MolaBucks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: command-deck — nav rail · working surface · JARVIS console rail. Single dark visual world by design. */
:root{
  --void:#04070c; --hull:#0a111c; --hull2:#0e1828; --hull3:#132137;
  --line:rgba(120,196,255,.13); --line2:rgba(120,196,255,.26);
  --ink:#dbe9f5; --dim:#8399ae; --faint:#55697d;
  --cyan:#4fd8ff; --cyan2:#9be9ff; --glow:rgba(79,216,255,.32);
  --amber:#f3b54a; --red:#ff6b6b; --green:#46dc9c; --violet:#a58bff;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:6px; --cut:10px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1200px 600px at 70% -10%,rgba(79,216,255,.07),transparent 60%),linear-gradient(rgba(120,196,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(120,196,255,.035) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::selection{background:rgba(79,216,255,.3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
a{color:var(--cyan)}

/* ---------- frame ---------- */
.app{position:relative;height:100%;display:grid;grid-template-columns:212px minmax(0,1fr) 372px;grid-template-rows:100%}
.side{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(10,17,28,.92),rgba(4,7,12,.92));display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand b{display:block;font:700 17px/1 var(--display);letter-spacing:.34em;color:var(--cyan);text-shadow:0 0 14px var(--glow)}
.brand span{display:block;margin-top:6px;font:500 10.5px/1.2 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px 10px;border-radius:var(--r);color:var(--dim);font:500 13.5px var(--body);text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:var(--ink);background:rgba(120,196,255,.05)}
.nav button.on{color:var(--cyan);background:rgba(79,216,255,.08);box-shadow:inset 2px 0 0 var(--cyan)}
#v-hq{max-width:none}
.hqwrap{display:flex;flex-direction:column;gap:10px;height:calc(100vh - 128px);min-height:460px}
.hqbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hqtitle{display:grid;grid-template-columns:auto auto;column-gap:9px;align-items:center;line-height:1}.hqtitle .hq-mark{grid-row:span 2;line-height:0}.hqtitle b{font:600 13px var(--display);letter-spacing:.22em;color:#f2ead8}.hqtitle span{font:600 10px var(--mono);letter-spacing:.4em;color:#b8954a;margin-top:3px;grid-column:2}
.seg{display:flex;gap:4px}
.hqstage{position:relative;flex:1;min-height:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#03060a}
#hqCanvas{position:absolute;inset:0}#hqCanvas canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:crosshair}
body.hq-imm .hqstage{position:fixed;inset:0;z-index:45;border:0;border-radius:0}
body.hq-imm .fab,body.hq-imm .tabbar{display:none!important}
.hqhud{position:absolute;inset:0;pointer-events:none;color:#dbe9f5;font-family:var(--body);user-select:none}
.hqhud button,.hq-map,.hq-travel,.hq-intro{pointer-events:auto}
.hq-tl{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.hq-brand{display:grid;grid-template-columns:auto auto;column-gap:9px;align-items:center}.hq-brand .hq-mark{grid-row:span 2;display:block;line-height:0;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}.hq-intro .mk,.hqload .mk{line-height:0;margin:0 auto 14px;filter:drop-shadow(0 4px 24px rgba(0,0,0,.6))}
body:not(.hq-imm) .hq-brand{display:none}
.hq-vrb{font:700 11px var(--mono);letter-spacing:.08em;width:auto!important;padding:0 9px!important}
.hq-vr3{margin-top:10px;background:transparent!important;border:1px solid rgba(127,230,255,.6)!important;color:#bff3ff!important}
.hq-xrnote{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,7,12,.86);z-index:6;text-align:center}.hq-xrnote[hidden]{display:none}.hq-xrnote div{display:grid;gap:10px;max-width:380px;padding:20px}.hq-xrnote b{font:600 22px "Cormorant Garamond",Georgia,serif;letter-spacing:.12em;color:#f2ead8}.hq-xrnote span{color:#9fb3c6;font-size:13px}
.hq-brand b{display:block;font:600 13px "Cormorant Garamond",Georgia,serif;font-size:16px;letter-spacing:.24em;color:#f2ead8;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.hq-brand span{font:600 10px var(--mono);letter-spacing:.55em;color:#b8954a}
.hq-sync,.hq-chip{font:500 10.5px var(--mono);letter-spacing:.08em;color:#a9bccc;display:flex;align-items:center;gap:7px;background:rgba(3,8,13,.58);border:1px solid rgba(120,196,255,.14);padding:5px 9px;border-radius:7px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hq-sync i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 9px currentColor}
.hq-compass{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(560px,48%);height:30px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);border-top:1px solid rgba(120,196,255,.3);background:linear-gradient(180deg,rgba(3,8,13,.6),rgba(3,8,13,0))}
.hq-cstrip{position:absolute;inset:0}
.hq-cstrip span{position:absolute;top:5px;transform:translateX(-50%);font:600 11px var(--mono);color:#cfe3f1}
.hq-cstrip span.t{width:1px;height:6px;top:0;background:rgba(159,180,198,.55)}
.hq-cstrip em{position:absolute;top:15px;width:7px;height:7px;margin-left:-3.5px;transform:rotate(45deg);border:1.5px solid #4fd8ff}
.hq-cstrip em.wp{width:9px;height:9px;margin-left:-4.5px;top:14px;box-shadow:0 0 10px #fff}
.hq-cneedle{position:absolute;left:50%;top:0;width:2px;height:10px;background:#4fd8ff;transform:translateX(-50%);box-shadow:0 0 8px #4fd8ff}
.hq-tr{position:absolute;right:14px;top:12px;display:flex;align-items:center;gap:6px}
.hq-ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid rgba(120,196,255,.2);background:rgba(3,8,13,.6);color:#cfe3f1;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0}
.hq-ib svg{width:16px;height:16px}.hq-ib.on{border-color:#4fd8ff;color:#4fd8ff}.hq-ib:hover{border-color:#4fd8ff}
.hq-obj{position:absolute;right:14px;top:56px;width:min(300px,38%);display:flex;flex-direction:column;gap:6px}
.hq-obj h4{margin:0 0 2px;font:600 10px var(--display);letter-spacing:.28em;color:#8399ae;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.hq-o{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start;text-align:left;background:rgba(3,8,13,.64);border:1px solid rgba(120,196,255,.13);border-left:2px solid var(--c);border-radius:8px;padding:8px 10px;color:#e6f1f8;font:500 12.5px/1.35 var(--body);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hq-o[disabled]{cursor:default;opacity:.95}.hq-o:not([disabled]):hover,.hq-o.on{background:rgba(79,216,255,.1)}
.hq-o kbd{font:600 10px var(--mono);color:var(--c);border:1px solid var(--c);border-radius:4px;padding:1px 0;text-align:center;margin-top:1px}
.hq-o small{display:block;color:#8ea3b5;font-size:11px;margin-top:2px;font-weight:400}
.hq-map{position:absolute;left:14px;bottom:14px;width:230px;height:161px;border-radius:10px;border:1px solid rgba(120,196,255,.22);background:rgba(3,8,13,.66);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hq-feed{position:absolute;right:14px;bottom:14px;width:min(330px,40%);display:flex;flex-direction:column-reverse;gap:6px}
.hq-ev{background:rgba(3,8,13,.8);border:1px solid rgba(120,196,255,.16);border-left:3px solid var(--c);border-radius:8px;padding:8px 11px;font:500 12.5px/1.35 var(--body);animation:hqIn .35s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .4s,transform .4s}
.hq-ev b{display:block;color:var(--c);font:600 10.5px var(--display);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.hq-ev.out{opacity:0;transform:translateX(20px)}
@keyframes hqIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.hqcross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(230,241,248,.85);box-shadow:0 0 6px rgba(0,0,0,.6);transition:all .15s}
.hqcross.f{width:20px;height:20px;margin:-10px 0 0 -10px;background:transparent;border:2px solid #4fd8ff;box-shadow:0 0 12px rgba(79,216,255,.6)}
.hqprompt{position:absolute;left:50%;top:calc(50% + 28px);transform:translateX(-50%);background:rgba(3,8,13,.82);border:1px solid rgba(79,216,255,.35);color:#eef7fc;padding:7px 13px;border-radius:8px;font:500 13px var(--body);white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hqprompt b{display:inline-block;border:1px solid var(--cyan);color:var(--cyan);border-radius:4px;padding:0 6px;margin-right:8px;font-family:var(--mono)}
.hqhelp{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);color:#a9bccc;font:500 12px var(--body);background:rgba(3,8,13,.6);padding:5px 10px;border-radius:7px;white-space:nowrap}
.hqhelp[hidden]{display:none}
.hqjoy{position:absolute;left:22px;bottom:30px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(120,196,255,.3);background:rgba(79,216,255,.06);touch-action:none;pointer-events:auto}
.hqjoy i{position:absolute;left:39px;top:39px;width:42px;height:42px;border-radius:50%;background:rgba(79,216,255,.35);border:1px solid var(--cyan)}
.hqjoy[hidden]{display:none}
.hq-fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .2s;pointer-events:none}.hq-fade.on{opacity:1}
.hq-travel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,6,10,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.hq-travel[hidden],.hq-intro[hidden],.hqload[hidden]{display:none}
.hq-travel .box{width:min(680px,92%);max-height:86%;overflow:auto;background:rgba(5,12,19,.94);border:1px solid rgba(120,196,255,.25);border-radius:12px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.hq-travel .hd{display:flex;align-items:center;margin-bottom:12px}.hq-travel .hd b{font:600 12px var(--display);letter-spacing:.3em;color:#4fd8ff}
.hq-travel .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.hq-dest{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid rgba(120,196,255,.15);border-left:3px solid var(--c);background:rgba(255,255,255,.03);color:#e6f1f8;cursor:pointer;font:600 13px var(--body)}
.hq-dest small{display:block;font:400 11.5px var(--body);color:#8ea3b5;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq-dest:hover{background:rgba(79,216,255,.1)}
.hq-intro{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 55%,rgba(2,6,10,.05),rgba(2,6,10,.78) 75%)}
.hq-intro .t1{font:600 clamp(26px,4.4vw,56px) "Cormorant Garamond",Georgia,serif;letter-spacing:.2em;color:#f2ead8;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.hq-intro .t2{font:600 12px var(--mono);letter-spacing:.7em;color:#b8954a;margin:8px 0 26px}
.hq-intro #hqEnter{font:600 13px var(--display);letter-spacing:.34em;padding:13px 32px;border:1px solid #4fd8ff;color:#eaf9ff;background:rgba(79,216,255,.14);border-radius:9px;cursor:pointer;box-shadow:0 0 34px rgba(79,216,255,.28)}
.hq-intro #hqEnter:hover{background:rgba(79,216,255,.24)}
.hq-link{margin-top:12px;background:none;border:0;color:#9fb4c6;font:500 12px var(--body);text-decoration:underline;cursor:pointer}
.hq-intro p{font:500 12px var(--body);color:#9fb4c6;margin-top:14px;letter-spacing:.04em}
.hqload{position:absolute;inset:0;display:grid;place-items:center;background:#03060a;text-align:center}
.hqload .t{font:600 15px "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;color:#f2ead8;margin-bottom:14px}
.hqload .bar{width:240px;height:2px;background:rgba(120,196,255,.15);margin:0 auto;overflow:hidden}.hqload .bar i{display:block;height:100%;width:0;background:#4fd8ff;box-shadow:0 0 10px #4fd8ff;transition:width .4s}
.hqload .s{font:500 11px var(--mono);letter-spacing:.14em;color:#8399ae;margin-top:12px;text-transform:uppercase}
@media (pointer:coarse),(max-width:760px){.hq-map{top:62px;bottom:auto;width:150px;height:105px}.hq-obj{top:auto;bottom:12px;right:10px;width:min(240px,55%)}.hq-obj h4{display:none}.hq-o small{display:none}.hq-feed{bottom:auto;top:62px;right:10px;width:min(260px,50%)}.hq-compass{width:52%}.hq-tl .hq-sync span{font-size:9px}.hq-brand{display:none}}
.hqops{overflow:auto}
.hqcard .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (max-width:860px){.hqwrap{height:calc(100vh - 190px)}}
.nav .grp{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:12px 10px 4px}
.hbars{display:flex;align-items:flex-end;gap:2px;height:96px;padding:0 2px;border-bottom:1px solid var(--line)}
.hb{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%;border-radius:3px 3px 0 0;cursor:default}
.hb i{flex:1;min-height:0;border-radius:3px 3px 0 0;display:block}
.hb:hover{background:rgba(120,196,255,.08)}
.hbtip{position:fixed;z-index:90;background:var(--hull3);border:1px solid var(--line2);color:var(--ink);font:500 12px var(--body);padding:5px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.nav .badge{margin-left:auto;font:500 11px var(--mono);color:var(--amber)}
.side-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;font:500 11px/1.3 var(--mono);color:var(--dim);letter-spacing:.02em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill.ok::before{background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.warn::before{background:var(--amber)}
.pill.bad::before{background:var(--red);box-shadow:0 0 8px var(--red)}
.pill.bad{color:var(--red)}

.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);min-height:62px}
.topbar h1{margin:0;font:600 19px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.topbar .sub{color:var(--dim);font-size:12.5px}
.topbar .grow{flex:1}
.goalchip{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--dim)}
.goalchip .bar{width:120px;height:4px;background:var(--hull3);position:relative;overflow:hidden;border-radius:2px}
.goalchip .bar i{position:absolute;inset:0 auto 0 0;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.demo-flag{font:600 11px var(--mono);letter-spacing:.16em;color:var(--violet);border:1px solid var(--violet);padding:3px 8px;border-radius:3px}
.estop-flag{font:600 11px var(--mono);letter-spacing:.12em;color:var(--red);border:1px solid var(--red);padding:3px 8px;border-radius:3px}
.views{flex:1;overflow-y:auto;padding:20px 22px 40px;min-height:0}
.view{display:none;max-width:1180px}
.view.on{display:block}

/* ---------- console ---------- */
.console{border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(10,17,28,.95),rgba(4,7,12,.97));display:flex;flex-direction:column;min-height:0;position:relative}
.con-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.con-head h2{margin:0;font:600 12px var(--display);letter-spacing:.28em;color:var(--dim);flex:1}
.tog{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--hull);border-radius:var(--r);color:var(--dim)}
.tog svg{width:17px;height:17px}
.tog.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,216,255,.08)}
.tog.off{color:var(--faint)}
.tog:disabled{opacity:.35;cursor:not-allowed}
.con-close{display:none}
.orbwrap{display:flex;flex-direction:column;align-items:center;padding:14px 12px 6px}
.orb{width:168px;height:168px;border:0;background:none;padding:0;border-radius:50%;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.orb canvas{width:100%;height:100%;display:block}
.orb-state{margin-top:6px;font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.orb-state i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.orb-state[data-s="listening"] i{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.orb-state[data-s="processing"] i{background:var(--violet)}
.orb-state[data-s="speaking"] i{background:var(--green)}
.orb-state[data-s="error"]{color:var(--red)}.orb-state[data-s="error"] i{background:var(--red)}
.mic-note{font-size:11.5px;color:var(--dim);text-align:center;padding:2px 18px 0;min-height:16px}
.log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:94%;font-size:13.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.you{align-self:flex-end;background:var(--hull3);padding:8px 11px;border-radius:10px 10px 2px 10px}
.msg.j{align-self:flex-start;padding:2px 0 2px 11px;border-left:2px solid var(--cyan)}
.msg.j .who{display:block;font:600 10px var(--mono);letter-spacing:.2em;color:var(--cyan);margin-bottom:2px}
.msg.sys{align-self:center;font:500 11px var(--mono);color:var(--faint)}
.msg .outcomes{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.msg .outcomes li{display:flex;gap:7px;align-items:flex-start;font-size:13px}
.msg .outcomes li::before{font:600 12px var(--mono);flex:none;width:14px}
.msg .outcomes li.ok::before{content:"✓";color:var(--green)}
.msg .outcomes li.failed::before,.msg .outcomes li.error::before{content:"✕";color:var(--red)}
.msg .outcomes li.skipped::before{content:"–";color:var(--faint)}
.msg .outcomes li.duplicate::before{content:"=";color:var(--amber)}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.plan{border:1px solid var(--line2);background:var(--hull);border-radius:var(--r);padding:10px 12px;margin-top:6px;white-space:normal}
.plan h4{margin:0 0 6px;font:600 11px var(--mono);letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.plan ol{margin:0 0 8px;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.plan .row-actions{display:flex;gap:8px}
.con-input{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}

function subscribeAll() {
  unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; S.loaded = new Set();

  if (S.mode !== "db") { loadLocal(); setTZ(S.settings.tz); scheduleRender(); return; }

    let q = db.collection(wsPath(k));
    if (k === "audit") q = q.orderBy("ts", "desc").limit(400);
    if (k === "runs") q = q.orderBy("ts", "desc").limit(200);
    const go = qq => unsubs.push(qq.onSnapshot(snap => applySnapshot(k, snap.docs.map(x => x.data())), err => {

    if (snap.exists) S.settings = settingsMerge(snap.data()); setTZ(S.settings.tz); S.loaded.add("settings"); scheduleRender(); scheduleEngineSync();

function checkSaidAmount(field, n, said, meta) {
  const label = (FIELD_LABEL[field] || field).toLowerCase();
  if (!has(said)) throw new OpError(`amounts_said.${field} is required: pass Mola's exact words for the ${label}.`);
  if (!saidByUser(said, meta)) throw new NeedInput(`Just to confirm, the ${label} is ${money(n)}?`, [{ label: `Yes, ${money(n)}`, value: `Yes, ${money(n)}` }], field);
  if (!amountIsExplicit(said)) throw new NeedInput(`When you said "${said}" for the ${label}, did you mean ${money(n)}?`, [{ label: `Yes, ${money(n)}`, value: `Yes, ${money(n)}` }], field);
  if (!amountMatches(said, n)) throw new NeedInput(`You said "${said}" for the ${label}. Is that ${money(n)}?`, [{ label: `Yes, ${money(n)}`, value: `Yes, ${money(n)}` }], field);
}
function assistantDate(field, v, said, meta) {
  const label = (FIELD_LABEL[field] || field).toLowerCase();
  if (!has(said)) throw new OpError(`dates_said.${field} is required: pass Mola's exact words for the date (for example "Friday").`);
  if (!saidByUser(said, meta)) throw new NeedInput(`Which date should I use for the ${label}?`, [], field);
  const r = resolveDate(said);
  if (r.ok) return r.date;
  if (r.ambiguous) throw new NeedInput(r.question, r.options.map(o => ({ label: fmtDay(o), value: fmtDay(o, true) })), field);
  throw new NeedInput(`I couldn't work out the date from "${said}". What date should I use?`, [], field);
}
function cleanDealFields(fields, meta, input) {
  const out = {};
  Object.entries(fields || {}).forEach(([k, v]) => {
    if (!(k in DEAL_FIELDS)) return;
    const c = cleanValue(k, DEAL_FIELDS[k], v, meta, input || fields);
    if (c !== undefined) out[k] = c;
  });
  if (has(out.address)) { out.address = normAddress(out.address); if (!out.state) out.state = stateFromAddress(out.address); }
  if (out.state) out.state = String(out.state).toUpperCase().slice(0, 2);
  return out;
}

/* ---------- record lookup ---------- */
const STOP = new Set(["the", "on", "at", "deal", "property", "house", "st", "street", "ave", "avenue", "rd", "road", "dr", "drive", "ln", "lane"]);
function scoreDeal(d, q) {
  const k = addrKey(q), ak = addrKey(d.address);
  if (!k) return 0;
  if (ak === k) return 100;
  if (ak.startsWith(k + " ") || ak.startsWith(k)) return 85;
  if (k.length >= 4 && ak.includes(k)) return 70;
  const toks = q.toLowerCase().split(/[^a-z0-9]+/).filter(t => t && !STOP.has(t));
  if (!toks.length) return 0;
  const hay = `${ak} ${String(d.seller || "").toLowerCase()} ${String(d.county || "").toLowerCase()}`;
  if (toks.every(t => new RegExp(`\\b${t}\\b`).test(hay))) return String(d.seller || "").toLowerCase().includes(toks.join(" ")) ? 60 : 50;
  return 0;
}
function findDeals(ref, opts = {}) {
  const q = String(ref || "").trim();
  if (!q) return [];
  const pool = S.deals.concat(opts.extra || []).filter(d => opts.includeArchived !== false || !d.archived);
  const byId = pool.find(d => d.id === q); if (byId) return [byId];
  const scored = pool.map(d => [scoreDeal(d, q), d]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]);
  if (!scored.length) return [];
  const top = scored[0][0];
  return scored.filter(x => x[0] === top).map(x => x[1]);
}
function resolveDeal(ref, meta = {}) {
  const r = String(ref || "").trim();
  const extra = meta.staged ? Array.from(meta.staged.values()) : [];
  if (!r || /^(current|this|this deal|it|that one|that deal)$/i.test(r)) {
    const f = meta.focusDealId && (S.deals.find(d => d.id === meta.focusDealId) || extra.find(d => d.id === meta.focusDealId));
    if (f) return f;
    throw new NeedInput("Which property do you mean?", []);
  }
  const hits = findDeals(r, { extra });
  if (hits.length === 1) return hits[0];
  if (!hits.length) throw new OpError(`No deal matches "${r}".`, "not_found");
  throw new NeedInput(`${hits.length} deals match "${r}". Which one?`, hits.slice(0, 6).map(d => ({ label: `${d.address}${d.seller ? " · " + d.seller : ""} · ${d.stage}`, value: `I mean ${d.address} (${d.id})`, id: d.id })));
}
function resolveById(kind, ref, labelFn) {
  const r = String(ref || "").trim();
  const exact = S[kind].find(x => x.id === r); if (exact) return exact;
  const hits = S[kind].filter(x => labelFn(x).toLowerCase().includes(r.toLowerCase()));
  if (hits.length === 1) return hits[0];
  if (!hits.length) throw new OpError(`Nothing in ${kind} matches "${r}".`, "not_found");
  throw new NeedInput(`${hits.length} match "${r}". Which one?`, hits.slice(0, 6).map(x => ({ label: labelFn(x), value: `I mean ${labelFn(x)} (${x.id})`, id: x.id })));
}
const taskLabel = t => `${t.title}${t.due ? " · " + fmtDay(t.due) : ""}`;
const buyerLabel = b => [b.name, b.company].filter(Boolean).join(" · ");

/* ---------- follow-up rules ---------- */
function followUpGap(outcome, streak) {
  const r = S.settings.rules;
  if (outcome === "no_answer") { const arr = r.noAnswer; return arr[Math.min(streak, arr.length) - 1]; }
  if (outcome === "talked") return r.talked;
  if (outcome === "not_now") return r.notNow;
  return null;
}
const fuTaskId = dealId => "fu_" + dealId;

/* ---------- audit helpers ---------- */
function diffRec(before, after) {
  const skip = new Set(["_ts", "updatedAt"]);
  const d = {};
  const keys = new Set([...Object.keys(before || {}), ...Object.keys(after || {})]);
  keys.forEach(k => {
    if (skip.has(k)) return;
    const a = before ? before[k] : undefined, b = after ? after[k] : undefined;
    if (stable(a) !== stable(b)) d[k] = [shorten(a), shorten(b)];
  });
  return d;
}
function shorten(v) { const s = typeof v === "string" ? v : v === undefined ? undefined : v; if (typeof s === "string" && s.length > 400) return "…" + s.slice(-400); if (Array.isArray(s) && stable(s).length > 2000) return `[${s.length} items]`; return s; }
const recName = (kind, r) => !r ? "" : kind === "deals" ? r.address : kind === "tasks" ? r.title : kind === "buyers" ? r.name : kind === "contracts" ? `${r.type === "assignment" ? "Assignment" : "Purchase agreement"} · ${String((r.fields || {}).address || "").split(",")[0]}` : kind === "attempts" ? `${OUTCOMES[r.outcome] || r.outcome} · ${r.address || ""}` : r.id;
function makeCtx(meta) {
  const changes = [];
  return Object.assign({}, meta, {
    changes,
    async put(kind, obj) {
      const before = S[kind].find(x => x.id === obj.id) || null;
      const rec = await save(kind, obj);
      changes.push({ kind, id: rec.id, name: recName(kind, rec), action: before ? "updated" : "created", diff: diffRec(before, rec) });
      return rec;
    },
    async del(kind, id) {
      const before = S[kind].find(x => x.id === id) || null;
      if (!before) return;
      await removeRec(kind, id);
      changes.push({ kind, id, name: recName(kind, before), action: "deleted", diff: diffRec(before, null) });
    }
  });
}
function trimForAudit(o) { try { const s = JSON.stringify(o ?? null); return s.length > 6000 ? JSON.parse(JSON.stringify(o, (k, v) => typeof v === "string" && v.length > 300 ? v.slice(0, 300) + "…" : Array.isArray(v) && v.length > 20 ? `[${v.length} items]` : v)) : JSON.parse(s); } catch (e) { return null; } }

/* ---------- operations ---------- */
const OPS = {};
function defOp(name, spec) { OPS[name] = Object.assign({ name, write: true, confirm: false, prepare: x => x, describe: () => spec.label }, spec); }
const appendNote = (old, txt) => ((old || "") + `\n[${today()}] ${txt}`).trim();

defOp("create_lead", {
  label: "Add lead",
  prepare(i, meta) {
    if (!has(i.address)) throw new NeedInput("What's the property address?", [], "address");
    const f = cleanDealFields(Object.assign({}, i.fields, { address: i.address }), meta, i);
    if (!/\d/.test(f.address.split(",")[0])) throw new NeedInput(`"${f.address}" has no street number. What's the full address?`, [], "address");
    const id = i.id || (meta.requestId ? "d_" + hash(meta.requestId + ":" + (meta.stepIndex || 0)) : uid("d_"));
    const dup = findDeals(f.address, { extra: meta.staged ? Array.from(meta.staged.values()) : [] }).filter(d => addrKey(d.address) === addrKey(f.address) && d.id !== id);
    if (dup.length && !i.allowDuplicate) throw new NeedInput(`${dup[0].address} is already in your pipeline (${dup[0].archived ? "archived" : dup[0].stage}). Update that deal instead?`, [{ label: "Open existing deal", value: `Use the existing deal ${dup[0].address} (${dup[0].id})`, id: dup[0].id }], "address");
    let followUp = "";
    if (has(i.followUp)) followUp = cleanValue("nextFollowUp", "date", i.followUp, meta, { dates_said: { nextFollowUp: (i.dates_said || {}).followUp } });
    return { id, fields: f, followUp, followUpNote: has(i.followUpNote) ? String(i.followUpNote) : "", allowDuplicate: !!i.allowDuplicate };
  },
  describe: i => `Add lead ${i.fields.address}${i.fields.seller ? ", seller " + i.fields.seller : ""}${i.fields.asking ? ", asking " + money(i.fields.asking) : ""}${i.followUp ? `; follow up ${fmtDay(i.followUp)}` : ""}`,
  async run(i, ctx) {
    const now = nowIso();
    const d = Object.assign({ stage: "New Lead", priority: "Normal", outreachPermission: "Unknown", optOut: false, tags: [], createdAt: now, propertyType: "" }, i.fields, { id: i.id, updatedAt: now });
    if (i.fields.notes) d.notes = `[${today()}] ${i.fields.notes}`;
    if (i.followUp) d.nextFollowUp = i.followUp;
    await ctx.put("deals", d);
    if (i.followUp) await ctx.put("tasks", { id: fuTaskId(d.id), title: i.followUpNote || `Follow up: ${d.seller ? d.seller + " · " : ""}${d.address.split(",")[0]}`, type: "Follow-up", due: i.followUp, dealId: d.id, done: false, createdAt: now });
    return { dealId: d.id, address: d.address, followUp: i.followUp || "" };
  },
  summary: (i, r) => `Added ${r.address}${r.followUp ? `, follow-up ${fmtDay(r.followUp)}` : ""}.`
});

defOp("update_deal", {
  label: "Update deal",
  prepare(i, meta) {
    const d = resolveDeal(i.deal, meta);
    const fields = cleanDealFields(i.fields, meta, i);
    if ("stage" in (i.fields || {})) throw new OpError("Use move_stage to change the stage.");
    if (!Object.keys(fields).length) throw new OpError("No valid fields to update.");
    return { dealId: d.id, address: d.address, fields };
  },
  describe: i => `Update ${i.address}: ${Object.keys(i.fields).map(k => FIELD_LABEL[k] || k).join(", ")}`,
  async run(i, ctx) {
    const d = S.deals.find(x => x.id === i.dealId); if (!d) throw new OpError("That deal no longer exists.", "not_found");
    const nd = Object.assign({}, d, i.fields, { updatedAt: nowIso() });
    if ("notes" in i.fields) nd.notes = i.fields.notes ? appendNote(d.notes, i.fields.notes) : d.notes;
    if (nd.optOut) { nd.outreachPermission = "Not granted"; }
    await ctx.put("deals", nd);
    if ("nextFollowUp" in i.fields) await syncFollowUpTask(nd, ctx);
    return { dealId: d.id, address: d.address, fields: Object.keys(i.fields) };
  },
  summary: (i, r) => `Updated ${r.address} (${r.fields.map(k => FIELD_LABEL[k] || k).join(", ")}).`
});
async function syncFollowUpTask(deal, ctx, title) {
  const id = fuTaskId(deal.id);
  const cur = S.tasks.find(t => t.id === id);
  if (deal.nextFollowUp && !deal.archived) {
    const t = Object.assign({ createdAt: nowIso(), type: "Follow-up" }, cur, { id, dealId: deal.id, due: deal.nextFollowUp, done: false, title: title || (cur && !cur.done ? cur.title : `Follow up: ${deal.seller ? deal.seller + " · " : ""}${deal.address.split(",")[0]}`) });
    if (!cur || cur.due !== t.due || cur.done || cur.title !== t.title) await ctx.put("tasks", t);
  } else if (cur && !cur.done) await ctx.put("tasks", Object.assign({}, cur, { done: true, doneAt: today(), cancelled: true }));
}

defOp("move_stage", {
  label: "Move stage", confirm: i => !!i.warning,
  prepare(i, meta) {
    const d = resolveDeal(i.deal, meta);
    const stage = STAGES.find(s => s.toLowerCase() === String(i.stage || "").toLowerCase()) || OLD_STAGE[String(i.stage || "").toLowerCase()];
    if (!stage) throw new OpError(`Stage must be one of: ${STAGES.join(", ")}.`);
    if (d.archived) throw new NeedInput(`${d.address} is archived (${d.archiveReason || "no reason"}). Restore it first?`, [{ label: "Restore it", value: `Restore ${d.address}` }]);
    const out = { dealId: d.id, address: d.address, from: d.stage, stage, by: (meta.source || "manual") + (typeof team !== "undefined" && team.enabled ? " · " + roleLabel(team.role) : ""), why: has(i.reason) ? String(i.reason).slice(0, 200) : "" };
    const gap = typeof stagePrereqGap === "function" ? stagePrereqGap(d, stage) : "";
    if (gap) out.warning = gap;
    if (stage === "Closed") {
      const fee = has(i.actualFee) ? cleanValue("actualFee", "money", i.actualFee, meta, i) : (has(d.actualFee) ? num(d.actualFee) : null);
      if (fee === null) throw new NeedInput(`What assignment fee did you actually collect on ${d.address}?`, [], "actualFee");
      out.actualFee = fee;
      out.closedAt = has(i.closedAt) && isYmd(i.closedAt) ? i.closedAt : today();
    }
    return out;
  },
  describe: i => `Move ${i.address} from ${i.from} to ${i.stage}${i.stage === "Closed" ? ` (collected ${money(i.actualFee)})` : ""}${i.warning ? `. Heads up: ${i.warning}` : ""}`,
  async run(i, ctx) {
    const d = S.deals.find(x => x.id === i.dealId); if (!d) throw new OpError("That deal no longer exists.", "not_found");
    const nd = Object.assign({}, d, { stage: i.stage, updatedAt: nowIso() });
    if (d.stage !== i.stage) nd.stageHistory = (d.stageHistory || []).concat([{ from: d.stage, to: i.stage, at: nowIso(), by: i.by || "manual", why: i.why || (i.warning ? "moved without: " + i.warning : "") }]).slice(-60);
    if (i.stage === "Closed") { nd.actualFee = i.actualFee; nd.closedAt = i.closedAt; nd.nextFollowUp = ""; }
    else { delete nd.closedAt; }
    await ctx.put("deals", nd);
    if (i.stage === "Closed") await syncFollowUpTask(nd, ctx);
    return { address: d.address, from: d.stage, stage: i.stage };
  },
  summary: (i, r) => r.from === r.stage ? `${r.address} was already in ${r.stage}.` : `Moved ${r.address} to ${r.stage}.`
});

defOp("log_call", {
  label: "Log call outcome",
  prepare(i, meta) {
    const d = resolveDeal(i.deal, meta);
    const outcome = String(i.outcome || "");
    if (!OUTCOMES[outcome]) throw new OpError(`Outcome must be one of: ${Object.keys(OUTCOMES).join(", ")}.`);
    if (d.archived && outcome !== "dead") throw new NeedInput(`${d.address} is archived. Restore it before logging calls?`, [{ label: "Restore it", value: `Restore ${d.address}` }]);
    if (outcome === "dead" && !has(i.reason)) throw new NeedInput(`What's the reason ${d.address} is dead?`, [], "reason");
    let date = "";
    if (has(i.followUp) && outcome !== "dead") date = cleanValue("nextFollowUp", "date", i.followUp, meta, { dates_said: { nextFollowUp: (i.dates_said || {}).followUp } });
    return { dealId: d.id, address: d.address, outcome, note: has(i.note) ? String(i.note).slice(0, 1000) : "", reason: has(i.reason) ? String(i.reason).slice(0, 200) : "", followUp: date, attemptId: i.attemptId || (meta.requestId ? "att_" + hash(meta.requestId + ":" + (meta.stepIndex || 0)) : uid("att_")) };
  },
  describe: i => `${OUTCOMES[i.outcome]} on ${i.address}${i.followUp ? `; follow up ${fmtDay(i.followUp)}` : ""}${i.reason ? ` (${i.reason})` : ""}`,
  async run(i, ctx) {
    const d = S.deals.find(x => x.id === i.dealId); if (!d) throw new OpError("That deal no longer exists.", "not_found");
    const streak = i.outcome === "no_answer" ? (d.noAnswerStreak || 0) + 1 : 0;
    let next = "";
    if (i.outcome !== "dead") next = i.followUp || addDays(today(), followUpGap(i.outcome, streak || 1));
    await ctx.put("attempts", { id: i.attemptId, dealId: d.id, address: d.address, outcome: i.outcome, note: i.note, reason: i.reason, at: nowIso(), day: today(), attempt: (d.touches || 0) + 1, scheduled: next });
    const nd = Object.assign({}, d, { touches: (d.touches || 0) + 1, lastContact: today(), noAnswerStreak: streak, updatedAt: nowIso() });
    if (i.outcome === "talked" || i.outcome === "not_now") { if (d.stage === "New Lead") nd.stage = "Contacted"; }
    const label = OUTCOMES[i.outcome] + (i.outcome === "no_answer" ? ` (attempt ${streak})` : "");
    nd.notes = appendNote(d.notes, `${label}${i.note ? ": " + i.note : ""}${i.reason ? ": " + i.reason : ""}`);
    if (i.outcome === "dead") { nd.archived = true; nd.archiveReason = i.reason; nd.archivedAt = today(); nd.nextFollowUp = ""; }
    else nd.nextFollowUp = next;
    await ctx.put("deals", nd);
    await syncFollowUpTask(nd, ctx, i.outcome === "not_now" ? `Nurture check-in: ${nd.address.split(",")[0]}` : undefined);
    return { address: d.address, outcome: i.outcome, nextFollowUp: next, stage: nd.stage, attempt: streak };
  },
  summary: (i, r) => r.outcome === "dead" ? `Logged dead on ${r.address}; archived and outreach stopped.` : `Logged ${OUTCOMES[r.outcome].toLowerCase()} on ${r.address}. Next follow-up ${fmtDay(r.nextFollowUp)}.`
});

function apptConflict(due, time, dur, ignoreId) {
  if (!time) return null;
  const toMin = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
  const a1 = toMin(time), a2 = a1 + (num(dur) || 60);
  return S.tasks.find(t => t.id !== ignoreId && !t.done && t.type === "Appointment" && t.due === due && t.time && (() => { const b1 = toMin(t.time), b2 = b1 + (num(t.durationMin) || 60); return a1 < b2 && b1 < a2; })());
}
defOp("create_task", {
  label: "Create task",
  prepare(i, meta) {
    if (!has(i.title)) throw new NeedInput("What's the task?", [], "title");
    const type = TASK_TYPES.find(t => t.toLowerCase() === String(i.type || "other").toLowerCase()) || "Other";
    let due = today();
    if (has(i.due)) due = cleanValue("due", "date", i.due, meta, { dates_said: { due: (i.dates_said || {}).due } });
    else if (meta.source === "assistant") throw new NeedInput(`When is "${i.title}" due?`, [], "due");
    let time = "";
    if (has(i.time)) { if (!/^\d{1,2}:\d{2}$/.test(i.time)) throw new OpError("Time must be HH:MM (24-hour)."); time = i.time.padStart(5, "0"); }
    if (type === "Appointment" && !time) throw new NeedInput(`What time is the appointment "${i.title}"?`, [], "time");
    const c = type === "Appointment" ? apptConflict(due, time, i.durationMin, i.id) : null;
    if (c) throw new OpError(`That overlaps "${c.title}" at ${c.time} on ${fmtDay(due)}. Pick another time.`, "conflict");
    let dealId = null;
    if (has(i.deal)) dealId = resolveDeal(i.deal, meta).id;
    const id = i.id || (meta.requestId ? "t_" + hash(meta.requestId + ":" + (meta.stepIndex || 0)) : uid("t_"));
    return { id, title: String(i.title).slice(0, 300), type, due, time, durationMin: num(i.durationMin) || (type === "Appointment" ? 60 : 0), dealId };
  },
  describe: i => `Task "${i.title}" ${fmtDay(i.due)}${i.time ? " " + i.time : ""}`,
  async run(i, ctx) {
    if (i.dealId && i.type === "Follow-up") {
      const d = S.deals.find(x => x.id === i.dealId);
      if (d) { const nd = Object.assign({}, d, { nextFollowUp: i.due, updatedAt: nowIso() }); await ctx.put("deals", nd); await syncFollowUpTask(nd, ctx, i.title); return { title: i.title, due: i.due, id: fuTaskId(d.id) }; }
    }
    await ctx.put("tasks", { id: i.id, title: i.title, type: i.type, due: i.due, time: i.time, durationMin: i.durationMin, dealId: i.dealId, done: false, createdAt: nowIso() });
    return { title: i.title, due: i.due, time: i.time, id: i.id };
  },
  summary: (i, r) => `Scheduled "${r.title}" for ${fmtDay(r.due)}${r.time ? " at " + r.time : ""}.`
});
defOp("update_task", {
  label: "Update task",

const BUYER_FIELDS = { name: "text", company: "text", phone: "phone", email: "email", markets: "tags", propertyTypes: "tags", minPrice: "money", maxPrice: "money", minBeds: "count", minBaths: "count", rehabTolerance: "text", strategy: "text", verified: "bool", qualificationNotes: "text", pofDate: "date", notes: "text", textPermission: "text" };
function cleanBuyer(f, meta, i) {
  const o = {};
  Object.entries(f || {}).forEach(([k, v]) => {
    if (!(k in BUYER_FIELDS)) return;
    const t = BUYER_FIELDS[k];
    if (t === "money") { const n = num(v); if (n < 0) throw new OpError("Prices can't be negative."); if (meta.source === "assistant" && has(v)) checkSaidAmount(k, n, (i.amounts_said || {})[k], meta); o[k] = has(v) ? n : ""; }
    else if (t === "date") { o[k] = has(v) ? (isYmd(v) ? v : (() => { throw new OpError("Proof-of-funds date must be a date."); })()) : ""; }
    else o[k] = cleanValue(k, t, v, null, {});
  });
  if (o.rehabTolerance && !["Light", "Medium", "Heavy", "Any"].includes(o.rehabTolerance)) o.rehabTolerance = ["light", "medium", "heavy", "any"].includes(String(o.rehabTolerance).toLowerCase()) ? o.rehabTolerance[0].toUpperCase() + o.rehabTolerance.slice(1).toLowerCase() : "";
  if (o.verified && !has(o.qualificationNotes)) throw new OpError("To mark a buyer verified, add what was verified (proof of funds, closed deals) in qualification notes.");
  return o;
}

            if (f.notes) d.notes = `[${today()}] ${f.notes}`;
            if (r.sourceMessage) d.sourceMessage = String(r.sourceMessage).slice(0, 3000);
            if (r.flags && r.flags.length) d.importFlags = r.flags;

/* ---------- the executor ---------- */
async function prepareOp(name, input, meta = {}) {
  const op = OPS[name]; if (!op) throw new OpError(`Unknown action "${name}".`);
  return op.prepare(JSON.parse(JSON.stringify(input || {})), meta);
}
function asNeed(e) {
  if (e instanceof NeedInput) return { status: "needs_input", question: e.question, choices: e.choices, field: e.field };
  if (e instanceof OpError) return { status: "error", code: e.code, message: e.message };
  return { status: "error", code: "internal", message: (e && e.message) || "Something went wrong." };
}
/** Runs a validated operation. Never reports success unless storage confirmed it. */
async function execOp(name, rawInput, meta = {}) {
  const op = OPS[name];
  if (!op) return { status: "error", message: `Unknown action "${name}".` };
  meta = Object.assign({ source: "manual" }, meta);
  meta.requestId = meta.requestId || uid("r");
  let input;
  try { input = meta.prepared ? rawInput : await prepareOp(name, rawInput, meta); } catch (e) { return asNeed(e); }
  const gap = typeof permissionGap === "function" ? permissionGap(name, input) : "";
  if (gap) return { status: "error", message: gap, error: gap };
  const needsConfirm = typeof op.confirm === "function" ? op.confirm(input) : op.confirm;
  if (needsConfirm && !meta.confirmed) return { status: "needs_confirm", message: op.describe(input), input };
  const key = meta.idemKey || `${meta.requestId}.${name}.${hash(stable(input))}`;
  const auditId = "a_" + hash(key);
  const prior = await getRec("audit", auditId);
  if (prior && prior.status === "ok") return { status: "duplicate", result: prior.result, message: `${prior.summary} (already done; not repeated)`, auditId };
  const ctx = makeCtx(meta);
  const started = nowIso();
  let status = "ok", result = null, error = "";
  try { result = await op.run(input, ctx); }
  catch (e) { status = "failed"; error = e.message || String(e); }
  const summary = status === "ok" ? op.summary(input, result) : `${op.label} failed: ${error}${ctx.changes.length ? ` (${ctx.changes.length} change${ctx.changes.length > 1 ? "s" : ""} saved before the failure)` : ""}`;
  const entry = { id: auditId, ts: started, finishedAt: nowIso(), source: meta.source, request: String(meta.request || "").slice(0, 1000), requestId: meta.requestId, op: name, label: op.label, describe: (() => { try { return op.describe(input); } catch (e) { return op.label; } })(), input: trimForAudit(input), status, error, summary, result: trimForAudit(result), changes: ctx.changes, actor: typeof actor === "function" ? actor() : null };
  let logged = true;
  try { await save("audit", entry); } catch (e) { logged = false; }
  return { status, result, message: summary, error, auditId, logged, changes: ctx.changes, input };
}
/** Manual-screen wrapper: shows confirmation sheets, errors and results consistently. */
async function runOp(name, input, opts = {}) {
  const meta = Object.assign({ source: "manual", requestId: opts.requestId || uid("r") }, opts.meta);
  let r = await execOp(name, input, meta);
  if (r.status === "needs_confirm") {
    const ok = await confirmSheet(r.message, opts.confirmLabel || OPS[name].label, opts.danger !== false);
    if (!ok) return r;
    r = await execOp(name, r.input, Object.assign({}, meta, { confirmed: true, prepared: true }));
  }
  if (r.status === "ok" || r.status === "duplicate") { if (!opts.quiet) toast(r.message + (r.logged === false ? " (activity log write failed)" : "")); }
  else if (r.status === "needs_input") { toast(r.question, "warn"); }
  else if (r.status === "failed" || r.status === "error") { toast(r.message || r.error, "error"); }
  return r;
}

/* ---------- read models shared by screens and the assistant ---------- */
function dealPublic(d) {
  const keys = ["id", "address", "county", "state", "stage", "archived", "archiveReason", "seller", "phone", "sellerEmail", "propertyType", "beds", "baths", "sqft", "yearBuilt", "asking", "price", "arv", "repairs", "mao", "fee", "actualFee", "motivation", "timeline", "occupancy", "condition", "source", "tags", "priority", "nextFollowUp", "closingDate", "touches", "lastContact", "optOut", "outreachPermission"];
  const o = {}; keys.forEach(k => { if (has(d[k]) && !(Array.isArray(d[k]) && !d[k].length)) o[k] = d[k]; });
  if (d.notes) o.recentNotes = String(d.notes).slice(-400);
  return o;
}
function queue() {
  const t = today();
  const pri = { High: 0, Normal: 1, Low: 2 };
  return S.deals.filter(d => !d.archived && d.stage !== "Closed" && ((d.nextFollowUp && d.nextFollowUp <= t) || (!d.nextFollowUp && !d.lastContact && d.stage === "New Lead")))
    .map(d => Object.assign({}, d, { _overdue: d.nextFollowUp ? Math.max(0, daysBetween(d.nextFollowUp, t)) : 0 }))
    .sort((a, b) => (b._overdue > 0) - (a._overdue > 0) || (pri[a.priority] ?? 1) - (pri[b.priority] ?? 1) || STAGES.indexOf(b.stage) - STAGES.indexOf(a.stage) || b._overdue - a._overdue || (a.nextFollowUp || "").localeCompare(b.nextFollowUp || ""));
}
function metrics() {
  const t = today(), ym = t.slice(0, 7);
  const live = S.deals.filter(d => !d.archived);
  const closed = live.filter(d => d.stage === "Closed");
  const closedMonth = closed.filter(d => String(d.closedAt || "").slice(0, 7) === ym);
  const collected = closedMonth.reduce((a, d) => a + num(d.actualFee), 0);
  const withFee = closed.filter(d => num(d.actualFee) > 0);
  const avgHist = withFee.length ? withFee.reduce((a, d) => a + num(d.actualFee), 0) / withFee.length : 0;
  const avg = avgHist || num(S.settings.avgFeeAssumption);
  const projectedDeals = live.filter(d => SIGNED_STAGES.includes(d.stage));
  const projected = projectedDeals.reduce((a, d) => a + num(d.fee), 0);
  const goal = num(S.settings.goal) || 50000;
  const remaining = Math.max(0, goal - collected);
  const tasksOpen = S.tasks.filter(x => !x.done);
  const overdue = tasksOpen.filter(x => x.due && x.due < t);
  const dueToday = tasksOpen.filter(x => x.due === t);
  const appts = tasksOpen.filter(x => x.type === "Appointment" && x.due >= t && x.due <= addDays(t, 7));
  const closings = live.filter(d => d.closingDate && d.closingDate >= t && d.closingDate <= addDays(t, 21) && d.stage !== "Closed");
  const stale = live.filter(d => d.stage !== "Closed" && d.stage !== "New Lead" && daysBetween(String(d.updatedAt || d.createdAt || nowIso()).slice(0, 10), t) >= num(S.settings.staleDays || 7));
  return {
    today: t, goal, collected, collectedDeals: closedMonth.length, projected, projectedDeals: projectedDeals.length, remaining,
    avgFee: Math.round(avg), avgSource: avgHist ? `average of ${withFee.length} closed deal${withFee.length > 1 ? "s" : ""}` : (avg ? "your assumption (no closed deals yet)" : ""),
    dealsNeeded: remaining && avg ? Math.ceil(remaining / avg) : null,
    newLeads: live.filter(d => d.stage === "New Lead").length,
    newThisWeek: live.filter(d => d.createdAt && daysBetween(d.createdAt.slice(0, 10), t) <= 7).length,
    overdue, dueToday, appts, offers: live.filter(d => d.stage === "Offer Made"),
    signedContracts: S.contracts.filter(c => c.status === "Signed"), closings, stale,
    counts: STAGES.reduce((a, s) => (a[s] = live.filter(d => d.stage === s).length, a), {}), archived: S.deals.filter(d => d.archived).length,
    queue: queue(), daysLeft: daysBetween(t, S.settings.goalMonthEnd || "2026-12-31")
  };
}
function briefing() {
  const m = metrics();
  const lines = [];
  lines.push(`${fmtDay(m.today, true)}. ${money(m.collected)} collected this month toward ${kmoney(m.goal)}${m.projected ? `; ${money(m.projected)} more is under signed contracts but not earned yet` : ""}.`);
  if (m.dealsNeeded !== null) lines.push(`At ${kmoney(m.avgFee)} per deal (${m.avgSource}), you need ${m.dealsNeeded} more closing${m.dealsNeeded === 1 ? "" : "s"} this month.`);
  else if (m.remaining) lines.push("There's no closed-deal history yet. Set an average-fee assumption in Settings to see how many deals the goal needs.");
  const q = m.queue;
  if (q.length) lines.push(`${q.length} lead${q.length > 1 ? "s" : ""} in the call queue. Start with ${q[0].address.split(",")[0]}${q[0].seller ? " (" + q[0].seller + ")" : ""}, ${q[0].stage}${q[0]._overdue ? `, ${q[0]._overdue} days overdue` : ""}.`);
  if (m.overdue.length) lines.push(`${m.overdue.length} overdue task${m.overdue.length > 1 ? "s" : ""}.`);
  if (m.appts.length) lines.push(`Appointments this week: ${m.appts.slice(0, 3).map(a => `${a.title} ${fmtDay(a.due)} ${a.time || ""}`.trim()).join("; ")}.`);
  if (m.closings.length) lines.push(`Upcoming closings: ${m.closings.map(d => `${d.address.split(",")[0]} ${fmtDay(d.closingDate)}`).join("; ")}.`);
  if (m.stale.length) lines.push(`${m.stale.length} deal${m.stale.length > 1 ? "s" : ""} with no activity in ${S.settings.staleDays || 7}+ days: ${m.stale.slice(0, 3).map(d => d.address.split(",")[0] + " (" + d.stage + ")").join(", ")}.`);
  if (!S.deals.length) lines.push("Your pipeline is empty. Add a lead or import a list to get started.");
  return { lines, metrics: { collected: m.collected, projected: m.projected, goal: m.goal, dealsNeeded: m.dealsNeeded, avgFee: m.avgFee, avgSource: m.avgSource, queue: q.slice(0, 8).map(dealPublic), overdueTasks: m.overdue.slice(0, 10), stale: m.stale.slice(0, 8).map(d => ({ id: d.id, address: d.address, stage: d.stage, lastUpdated: (d.updatedAt || "").slice(0, 10) })), upcomingClosings: m.closings.map(dealPublic), counts: m.counts } };
}

/* ---------- confirm / prompt (the viewer blocks native dialogs) ---------- */
function confirmSheet(message, okLabel = "Confirm", danger = true, extraHtml = "") {
  if (typeof hqxActive === "function" && hqxActive()) return hqxConfirm(message, okLabel, danger).then(ok => ok && extraHtml ? {} : ok); // in VR: the same confirmation, on the headset panel
  return new Promise(res => {
    const m = $("#modal");
    m.innerHTML = `<h4>Please confirm</h4><p>${esc(message)}</p>${extraHtml}<div class="acts"><button class="btn ghost" data-m="no">Cancel</button><button class="btn ${danger ? "danger" : "pri"}" data-m="yes">${esc(okLabel)}</button></div>`;
    m.classList.add("on"); $("#modalScrim").classList.add("on");
    const done = v => { m.classList.remove("on"); $("#modalScrim").classList.remove("on"); m.onclick = null; res(v); };
    m.onclick = e => { const b = e.target.closest("[data-m]"); if (b) done(b.dataset.m === "yes" ? (extraHtml ? Object.fromEntries($$("input,select,textarea", m).map(x => [x.name, x.type === "checkbox" ? x.checked : x.value])) : true) : false); };
    $("#modalScrim").onclick = () => done(false);
    setTimeout(() => { const f = $("input,select,textarea", m) || $('[data-m="yes"]', m); f && f.focus(); }, 30);
  });
}

  $("#toasts").appendChild(el);

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("Copied"); }
  catch (e) {
    const a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (x) {}
    a.remove(); toast(ok ? "Copied" : "Copy blocked here. Select the text and copy it manually.", ok ? "" : "warn");
  }
}

function fld(name, label, value, type = "text", cls = "", attrs = "") {

  if (type === "checkbox") return `<label class="f chk ${cls}"><input type="checkbox" name="${name}" id="f_${name}" ${v ? "checked" : ""} ${attrs}><span>${label}</span></label>`;
  const im = /money|count|year|num/.test(type) ? ' inputmode="decimal"' : "";
  const t = /money|count|year|num/.test(type) ? "text" : type;
  return `<label class="f ${cls}"><span>${label}</span><input type="${t}" name="${name}" id="f_${name}" value="${esc(v)}"${im} ${attrs}></label>`;
}

function kpi(label, v, view, cls, sub) { return `<button class="kpi ${cls || ""}" data-view="${view}"><div class="v">${v}</div><div class="l">${label}</div>${sub ? `<div class="note">${esc(sub)}</div>` : ""}</button>`; }
function drawRing(c, pct) {
  if (!c || !c.getContext) return; const x = c.getContext("2d"); if (!x) return;
  const W = c.width, cx = W / 2, r = W * 0.4;
  x.clearRect(0, 0, W, W);
  x.lineCap = "butt";
  for (let i = 0; i < 60; i++) { const a = -Math.PI / 2 + i / 60 * Math.PI * 2; x.strokeStyle = i / 60 < pct ? "rgba(79,216,255,.9)" : "rgba(120,196,255,.14)"; x.lineWidth = 2; x.beginPath(); x.moveTo(cx + Math.cos(a) * (r + 18), cx + Math.sin(a) * (r + 18)); x.lineTo(cx + Math.cos(a) * (r + 26), cx + Math.sin(a) * (r + 26)); x.stroke(); }
  x.lineWidth = 14; x.strokeStyle = "rgba(120,196,255,.1)"; x.beginPath(); x.arc(cx, cx, r, 0, Math.PI * 2); x.stroke();
  if (pct > 0) { x.strokeStyle = "#4fd8ff"; x.shadowColor = "rgba(79,216,255,.7)"; x.shadowBlur = 16; x.beginPath(); x.arc(cx, cx, r, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2); x.stroke(); x.shadowBlur = 0; }
  x.fillStyle = "#dbe9f5"; x.font = `600 ${W * 0.16}px "Chakra Petch", sans-serif`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(Math.round(pct * 100) + "%", cx, cx);
}

async function logOutcomeUI(id, outcome, btn) {

  const input = { deal: id, outcome };
  if (outcome === "dead") {

  } else if (outcome === "talked" || outcome === "not_now") {

    const r = await askSheet(`${OUTCOMES[outcome]}: ${d.address}`, `${fld("note", "What happened (optional)", "", "textarea")}${fld("date", `Next follow-up (default ${fmtDay(def)})`, def, "date")}`, "Log it");

/* ============================================================
   JARVIS · Acquisitions: qualification checklist, stage gates,
   offer scenarios with approval, and the Hunter -> Closer handoff.
   ============================================================ */
const ACQ_CHECKS = [["motivation", "Seller motivation confirmed"], ["timeline", "Timeline confirmed"], ["condition", "Property condition assessed"], ["occupancy", "Occupancy confirmed"], ["comps", "Comparable sales reviewed"], ["underwriting", "Underwriting complete"]];
const OFFER_STATUS = { pending_approval: ["Awaiting your approval", "am"], approved: ["Approved", "cy"], presented: ["Presented", "vi"], accepted: ["Accepted by seller", "gr"], countered: ["Seller countered", "am"], rejected: ["Rejected by seller", "rd"], withdrawn: ["Withdrawn", ""] };
const HANDOFF_STATUS = { pending: ["With The Closer: awaiting acceptance", "am"], accepted: ["Accepted by The Closer", "gr"], rejected: ["Returned to acquisitions", "rd"] };
const OFFER_DEFAULTS = { room: 7, consArv: 7.5, consRep: 20, optArv: 5, optRep: 10, round: 500 };

function dealOffers(id) { return S.offers.filter(o => o.dealId === id).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))); }
function liveOffer(id) { return dealOffers(id).find(o => ["approved", "presented", "accepted", "countered"].includes(o.status)); }
function signedPurchase(id) { return S.contracts.find(c => c.dealId === id && c.type === "purchase" && c.status === "Signed"); }

// Stage prerequisites. Returning text means "missing"; the move still works after you confirm.
function stagePrereqGap(d, stage) {
  const idx = s => STAGES.indexOf(s);
  if (idx(stage) <= idx(d.stage)) return "";
  if (stage === "Offer Made" && !liveOffer(d.id)) return "no approved offer is on file";
  if (idx(stage) >= idx("Under Contract") && stage !== "Closed" && !signedPurchase(d.id)) return "no signed purchase agreement is recorded";
  if (idx(stage) >= idx("Buyer Secured") && stage !== "Closed" && (!d.handoff || d.handoff.status !== "accepted")) return "The Closer hasn't accepted the handoff";
  return "";
}

function offerMath(inp) {
  const v = (x, dflt) => has(x) && num(x) !== null && !isNaN(num(x)) ? num(x) : dflt;
  const arv = num(inp.arv), rep = num(inp.repairs), pct = num(inp.pct) || 70, fee = num(inp.fee) || 0, room = v(inp.room, OFFER_DEFAULTS.room);
  const sc = (arvAdj, repAdj) => { const a = arv * (1 + arvAdj / 100), r = rep * (1 + repAdj / 100); const buyer = a * pct / 100 - r; return { arv: Math.round(a), repairs: Math.round(r), buyerPrice: Math.round(buyer), mao: Math.round(buyer - fee) }; };
  const scenarios = { conservative: sc(-v(inp.consArv, OFFER_DEFAULTS.consArv), v(inp.consRep, OFFER_DEFAULTS.consRep)), base: sc(0, 0), optimistic: sc(v(inp.optArv, OFFER_DEFAULTS.optArv), -v(inp.optRep, OFFER_DEFAULTS.optRep)) };
  const roundDown = v => Math.floor(v / OFFER_DEFAULTS.round) * OFFER_DEFAULTS.round;
  const recommended = Math.max(0, roundDown(scenarios.base.mao * (1 - room / 100)));
  const maxAuthorized = Math.max(0, roundDown(Math.min(scenarios.base.mao, num(inp.cap) || Infinity)));
  Object.values(scenarios).forEach(s => { s.spreadAtOffer = s.buyerPrice - recommended; s.spreadAtMax = s.buyerPrice - maxAuthorized; });
  return { scenarios, recommended, maxAuthorized, pct, fee, room };
}

defOp("create_offer", {
  label: "Prepare offer",
  prepare(i, meta) {
    const d = resolveDeal(i.deal, meta);
    const arv = has(i.arv) ? num(i.arv) : num(d.arv), rep = has(i.repairs) ? num(i.repairs) : num(d.repairs);
    if (!num(arv)) throw new NeedInput(`${d.address} has no ARV. Add sold comps in the Analyzer (or enter the ARV) first.`, [], "arv");
    if (rep === null || rep === undefined || !has(rep)) throw new NeedInput(`What's the repair estimate for ${d.address}? Run the rehab estimator or enter one.`, [], "repairs");
    const inp = { arv, repairs: rep, pct: num(i.pct) || S.settings.maoPct || 70, fee: has(i.fee) ? num(i.fee) : (num(d.fee) || S.settings.defaultFee || 0), room: has(i.room) ? num(i.room) : OFFER_DEFAULTS.room, cap: has(i.cap) ? num(i.cap) : null };
    const m = offerMath(inp);
    if (m.scenarios.base.mao <= 0) throw new OpError(`At these numbers the MAO is ${money(m.scenarios.base.mao)}: there's no room for an offer.`);
    const warnings = [];
    if (!(d.comps && d.comps.length) && !(d.analysis && /comp/i.test(d.analysis.arvSource || ""))) warnings.push("ARV isn't backed by comps saved on this deal: treat it as unverified");
    if (!(S.rehabs || []).some(r => r.dealId === d.id && r.status === "Approved")) warnings.push("No approved rehab estimate on this deal");
    if (num(d.asking) && num(d.asking) > m.maxAuthorized) warnings.push(`Seller's asking ${money(d.asking)} is above your max ${money(m.maxAuthorized)}`);
    if (d.optOut) warnings.push("Seller opted out of contact");
    return { id: i.id || uid("of_"), dealId: d.id, address: d.address, inputs: inp, ...m, warnings, asking: num(d.asking) || null, notes: has(i.notes) ? String(i.notes).slice(0, 500) : "" };
  },
  describe: i => `Prepare an offer on ${i.address}: open at ${money(i.recommended)}, max ${money(i.maxAuthorized)} (needs your approval)`,
  async run(i, ctx) {
    const dd = S.deals.find(x => x.id === i.dealId);
    if (dd && acqRank("offer_approval") > acqRank(acqStageOf(dd))) await ctx.put("deals", Object.assign({}, dd, { acqStage: "offer_approval" }));
    await ctx.put("offers", { id: i.id, dealId: i.dealId, inputs: i.inputs, scenarios: i.scenarios, recommended: i.recommended, maxAuthorized: i.maxAuthorized, pct: i.pct, fee: i.fee, room: i.room, warnings: i.warnings, asking: i.asking, notes: i.notes, status: "pending_approval", history: [{ status: "pending_approval", at: nowIso(), by: ctx.source || "manual" }], createdAt: nowIso() });
    return { id: i.id, recommended: i.recommended, maxAuthorized: i.maxAuthorized };
  },
  summary: (i, r) => `Prepared an offer on ${i.address}: open ${money(r.recommended)}, max ${money(r.maxAuthorized)}. It needs your approval before it's presented.`
});

defOp("set_offer_status", {
  label: "Update offer",
  confirm: i => ["approved", "presented"].includes(i.status),
  prepare(i, meta) {
    const o = S.offers.find(x => x.id === i.offerId); if (!o) throw new OpError("Offer not found.", "not_found");
    const d = S.deals.find(x => x.id === o.dealId) || {};
    const allowed = { pending_approval: ["approved", "withdrawn"], approved: ["presented", "withdrawn"], presented: ["accepted", "countered", "rejected", "withdrawn"], countered: ["presented", "accepted", "rejected", "withdrawn"], accepted: ["withdrawn"], rejected: [], withdrawn: [] }[o.status] || [];
    if (!allowed.includes(i.status)) throw new OpError(`An offer that's "${(OFFER_STATUS[o.status] || [o.status])[0]}" can't go to "${(OFFER_STATUS[i.status] || [i.status])[0]}".`);
    if (i.status === "approved" && meta.source === "assistant") throw new OpError("Offers are approved by you on the screen, not by voice or chat.");
    if (i.status === "presented" && d.optOut) throw new OpError("This seller opted out of contact.");
    let amount = o.recommended;
    if (i.status === "presented") {
      amount = has(i.amount) ? num(i.amount) : o.recommended;
      if (!num(amount)) throw new NeedInput("What price did you present?", [], "amount");
      if (amount > o.maxAuthorized) throw new OpError(`${money(amount)} is above the approved max of ${money(o.maxAuthorized)}. Prepare a new offer to go higher.`);
    }
    const counter = i.status === "countered" ? num(i.counter) : null;
    if (i.status === "countered" && !counter) throw new NeedInput("What did the seller counter at?", [], "counter");
    return { offerId: o.id, dealId: o.dealId, address: d.address || "", status: i.status, from: o.status, amount, counter, method: has(i.method) ? String(i.method).slice(0, 60) : "", note: has(i.note) ? String(i.note).slice(0, 300) : "", maxAuthorized: o.maxAuthorized };
  },
  describe: i => ({ approved: `Approve the offer on ${i.address}: you authorize presenting up to ${money(i.maxAuthorized)}`, presented: `Record that you presented ${money(i.amount)} to the seller of ${i.address}${i.method ? " by " + i.method : ""}`, accepted: `Record that the seller accepted on ${i.address}`, countered: `Record the seller's counter of ${money(i.counter)} on ${i.address}`, rejected: `Record that the seller rejected the offer on ${i.address}`, withdrawn: `Withdraw the offer on ${i.address}` })[i.status],
  async run(i, ctx) {
    const o = S.offers.find(x => x.id === i.offerId);
    const no = Object.assign({}, o, { status: i.status, history: (o.history || []).concat([{ status: i.status, at: nowIso(), by: ctx.source || "manual", amount: i.status === "presented" ? i.amount : undefined, counter: i.counter || undefined, method: i.method || undefined, note: i.note || undefined }]) });
    if (i.status === "approved") no.approvedAt = nowIso();
    if (i.status === "presented") { no.presentedAmount = i.amount; no.presentedAt = nowIso(); }
    if (i.status === "countered") no.counter = i.counter;
    await ctx.put("offers", no);
    const d0 = S.deals.find(x => x.id === i.dealId);
    const auto = { approved: "offer_prepared", presented: "offer_presented", countered: "negotiation", accepted: "verbal" }[i.status];
    if (d0 && auto && acqRank(auto) > acqRank(acqStageOf(d0))) await ctx.put("deals", Object.assign({}, d0, { acqStage: auto }));
    const d = S.deals.find(x => x.id === i.dealId);
    if (d && ["presented", "accepted", "countered"].includes(i.status)) {
      const nd = Object.assign({}, d, { updatedAt: nowIso() });
      if (i.status === "presented") nd.price = i.amount;
      if (i.status === "countered") nd.asking = i.counter;
      nd.notes = appendNote(d.notes, { presented: `Offer presented: ${money(i.amount)}${i.method ? " by " + i.method : ""}.`, accepted: "Seller accepted the offer (verbal). Next: purchase agreement.", countered: `Seller countered at ${money(i.counter)}.` }[i.status] + (i.note ? " " + i.note : ""));
      if (i.status === "presented" && STAGES.indexOf(d.stage) < STAGES.indexOf("Offer Made")) { nd.stageHistory = (d.stageHistory || []).concat([{ from: d.stage, to: "Offer Made", at: nowIso(), by: ctx.source || "manual", why: "offer presented" }]); nd.stage = "Offer Made"; }
      await ctx.put("deals", nd);
    }
    return { status: i.status };
  },
  summary: i => ({ approved: `Approved: you can present up to ${money(i.maxAuthorized)} on ${i.address}.`, presented: `Recorded: ${money(i.amount)} presented on ${i.address}.`, accepted: `Recorded: seller accepted on ${i.address}.`, countered: `Recorded: seller countered at ${money(i.counter)}.`, rejected: "Recorded: seller rejected.", withdrawn: "Offer withdrawn." })[i.status]
});

defOp("set_acq_check", {
  label: "Qualification checklist",
  prepare(i, meta) { const d = resolveDeal(i.deal, meta); const k = ACQ_CHECKS.find(c => c[0] === i.key); if (!k) throw new OpError("Unknown checklist item."); return { dealId: d.id, address: d.address, key: k[0], label: k[1], value: !!i.value, note: has(i.note) ? String(i.note).slice(0, 200) : "" }; },
  describe: i => `${i.value ? "Check" : "Uncheck"} "${i.label}" on ${i.address}`,
  async run(i, ctx) {
    const d = S.deals.find(x => x.id === i.dealId);
    const acq = Object.assign({}, d.acq || {}); acq[i.key] = i.value ? { at: nowIso(), by: ctx.source || "manual", note: i.note } : null;
    await ctx.put("deals", Object.assign({}, d, { acq, updatedAt: nowIso() }));
    return {};
  },
  summary: i => `${i.label}: ${i.value ? "done" : "not done"}.`
});

function handoffCheck(d) {
  const c = signedPurchase(d.id), o = liveOffer(d.id);
  const items = [
    ["Signed purchase agreement recorded", !!c, c ? `Signed ${fmtStamp((c.history || []).filter(h => h.status === "Signed").slice(-1)[0]?.at || c.updatedAt)}` : "Record the signed contract on the Contracts screen"],
    ["Contract price", num((c && c.fields && c.fields.price) || d.price) > 0, money(num((c && c.fields && c.fields.price) || d.price) || 0)],
    ["ARV (comps source shown)", num(d.arv) > 0, num(d.arv) ? `${money(d.arv)}${d.analysis && d.analysis.arvSource ? " · " + d.analysis.arvSource : " · source not recorded"}` : "missing"],
    ["Repair estimate", has(d.repairs), has(d.repairs) ? money(num(d.repairs)) : "missing"],
    ["Target assignment fee", num(d.fee) > 0, num(d.fee) ? money(d.fee) : "missing"],
    ["Seller contact", has(d.seller) || has(d.phone), [d.seller, d.phone].filter(Boolean).join(" · ") || "missing"],
  ];
  const issues = [];
  const text = c ? JSON.stringify(c.fields || {}) + " " + (c.templateId || "") : "";
  if (c && !/assign/i.test(text) && c.templateId !== "psa-asis") issues.push("Confirm the purchase agreement allows assignment");
  issues.push("Title / closing status not yet confirmed"); // JARVIS has no title integration; always a human check
  if ((d.tags || []).some(t => /bankruptcy|probate|divorce/i.test(t))) issues.push("Sensitive record on this deal (probate/bankruptcy/divorce): legal review before marketing");
  if (!o) issues.push("No approved offer on file for the agreed price");
  return { items, ok: items.every(x => x[1]), issues, contractId: c && c.id };
}

defOp("handoff_to_closer", {
  label: "Hand deal to The Closer",
  confirm: true,
  prepare(i, meta) {
    const d = resolveDeal(i.deal, meta);
    if (d.handoff && ["pending", "accepted"].includes(d.handoff.status)) throw new OpError(`${d.address} is already with The Closer (${HANDOFF_STATUS[d.handoff.status][0]}).`);
    if (STAGES.indexOf(d.stage) < STAGES.indexOf("Under Contract")) throw new OpError(`${d.address} is in ${d.stage}. Hand off once it's Under Contract with a signed purchase agreement.`);
    const chk = handoffCheck(d);
    const missing = chk.items.filter(x => !x[1]).map(x => x[0]);
    if (missing.length) throw new OpError(`Not ready for The Closer. Missing: ${missing.join(", ")}.`);
    return { dealId: d.id, address: d.address, checklist: chk.items.map(([item, ok, detail]) => ({ item, ok, detail })), issues: chk.issues, contractId: chk.contractId, note: has(i.note) ? String(i.note).slice(0, 500) : "" };
  },
  describe: i => `Hand ${i.address} to The Closer for disposition${i.issues.length ? ` (open items: ${i.issues.join("; ")})` : ""}`,
  async run(i, ctx) {
    const d = S.deals.find(x => x.id === i.dealId);
    const o = liveOffer(d.id);
    const pkg = { status: "pending", at: nowIso(), by: ctx.source || "manual", contractId: i.contractId, contractPrice: num((S.contracts.find(c => c.id === i.contractId)?.fields || {}).price) || num(d.price), arv: num(d.arv), arvSource: d.analysis && d.analysis.arvSource || "", repairs: num(d.repairs), mao: num(d.mao), fee: num(d.fee), offerId: o && o.id, checklist: i.checklist, issues: i.issues, note: i.note, history: ((d.handoff && d.handoff.history) || []).concat([{ status: "pending", at: nowIso(), by: ctx.source || "manual" }]) };
    await ctx.put("deals", Object.assign({}, d, { handoff: pkg, acqStage: "transferred", updatedAt: nowIso(), notes: appendNote(d.notes, "Handed to The Closer for disposition.") }));
    return { status: "pending" };
  },
  summary: i => `${i.address} is with The Closer, waiting for acceptance.`
});

defOp("closer_handoff_response", {
  label: "Closer handoff decision",
  prepare(i, meta) {
    const d = resolveDeal(i.deal, meta);
    if (!d.handoff || d.handoff.status !== "pending") throw new OpError("There's no pending handoff on this deal.");
    if (!["accepted", "rejected"].includes(i.decision)) throw new OpError("Accept or reject.");
    if (i.decision === "rejected" && !has(i.reason)) throw new NeedInput("Why is The Closer sending it back?", [], "reason");
    return { dealId: d.id, address: d.address, decision: i.decision, reason: has(i.reason) ? String(i.reason).slice(0, 300) : "" };
  },
  describe: i => i.decision === "accepted" ? `The Closer accepts ${i.address} for disposition` : `Return ${i.address} to acquisitions: ${i.reason}`,
  async run(i, ctx) {
    const d = S.deals.find(x => x.id === i.dealId);
    const h = Object.assign({}, d.handoff, { status: i.decision, decidedAt: nowIso(), reason: i.reason, history: (d.handoff.history || []).concat([{ status: i.decision, at: nowIso(), by: ctx.source || "manual", reason: i.reason || undefined }]) });
    await ctx.put("deals", Object.assign({}, d, { handoff: h, updatedAt: nowIso(), notes: appendNote(d.notes, i.decision === "accepted" ? "The Closer accepted the deal for disposition." : `The Closer returned the deal: ${i.reason}`) }));
    if (i.decision === "rejected") await ctx.put("tasks", { id: uid("t_"), title: `Fix for Closer handoff: ${i.reason}`.slice(0, 120), type: "Other", due: today(), dealId: d.id, done: false, createdAt: nowIso() });
    return { decision: i.decision };
  },

});

/* ---------- full acquisition stage list, mapped onto the 8 pipeline stages ---------- */
// Steps 1-4 (discovered, validation, skip trace pending, contact imported) live in The Hunter before a lead is promoted.
const ACQ_STAGES = [
  ["review", "Acquisition review", "New Lead"],
  ["qualified_opp", "Qualified opportunity", "New Lead"],
  ["outreach_eligible", "Seller outreach eligible", "New Lead"],
  ["contacted", "Seller contacted", "Contacted"],
  ["conversation", "Conversation in progress", "Contacted"],
  ["motivation", "Motivation & timeline confirmed", "Qualified"],
  ["condition", "Condition & occupancy assessed", "Qualified"],
  ["comps", "Comparable sales reviewed", "Qualified"],
  ["underwritten", "Underwriting complete", "Qualified"],
  ["offer_approval", "Offer approval pending", "Qualified"],
  ["offer_prepared", "Offer prepared (approved)", "Qualified"],
  ["offer_presented", "Offer presented", "Offer Made"],
  ["negotiation", "Negotiation", "Offer Made"],
  ["verbal", "Verbal agreement", "Offer Made"],
  ["contract_sent", "Contract sent", "Offer Made"],
  ["contract_executed", "Contract executed", "Under Contract"],
  ["due_diligence", "Due diligence / title review", "Under Contract"],
  ["transferred", "Transferred to The Closer", "Under Contract"],
  ["nurture", "Nurture", null], ["lost", "Lost / rejected / disqualified", null]
];
const ACQ_IDX = Object.fromEntries(ACQ_STAGES.map((s, i) => [s[0], i]));
const acqRank = k => k === "nurture" || k === "lost" ? -1 : ACQ_IDX[k];
function acqStageOf(d) {
  if (d.acqStage && ACQ_IDX[d.acqStage] !== undefined) return d.acqStage;
  if (d.archived) return "lost";
  return { "New Lead": "review", Contacted: "contacted", Qualified: "motivation", "Offer Made": "offer_presented", "Under Contract": "contract_executed" }[d.stage] || "transferred";
}
function acqPrereqGap(d, key) {
  const c = d.acq || {}, offers = dealOffers(d.id);
  const purchase = S.contracts.filter(x => x.dealId === d.id && x.type === "purchase");
  const need = {
    outreach_eligible: () => d.optOut ? "seller opted out" : d.outreachPermission === "Not granted" ? "outreach permission is Not granted" : !has(d.phone) && !has(d.sellerEmail) ? "no phone or email on file" : "",
    motivation: () => !c.motivation || !c.timeline ? "motivation and timeline aren't checked off" : "",
    condition: () => !c.condition || !c.occupancy ? "condition and occupancy aren't checked off" : "",
    comps: () => !c.comps ? "comps review isn't checked off" : !(d.comps || []).length ? "no comps saved on the deal" : "",
    underwritten: () => !num(d.arv) || !has(d.repairs) ? "ARV and repairs aren't both set" : !c.underwriting ? "underwriting isn't checked off" : "",
    offer_approval: () => !offers.some(o => o.status === "pending_approval") ? "no offer waiting for approval" : "",
    offer_prepared: () => !offers.some(o => ["approved", "presented", "countered", "accepted"].includes(o.status)) ? "no approved offer" : "",
    offer_presented: () => !offers.some(o => o.presentedAt) ? "no offer recorded as presented" : "",
    verbal: () => !offers.some(o => o.status === "accepted") ? "seller acceptance isn't recorded" : "",
    contract_sent: () => !purchase.some(x => ["Sent", "Signed"].includes(x.status)) ? "no purchase agreement recorded as sent" : "",
    contract_executed: () => !purchase.some(x => x.status === "Signed") ? "no signed purchase agreement" : "",
    transferred: () => !d.handoff || !["pending", "accepted"].includes(d.handoff.status) ? "not handed to The Closer yet" : ""
  }[key];
  return need ? need() : "";
}
defOp("set_acq_stage", {
  label: "Acquisition stage", confirm: i => !!i.warning,
  prepare(i, meta) {
    const d = resolveDeal(i.deal, meta);
    const st = ACQ_STAGES.find(s => s[0] === i.stage || s[1].toLowerCase() === String(i.stage || "").toLowerCase());
    if (!st) throw new OpError(`Unknown acquisition stage. Options: ${ACQ_STAGES.map(s => s[1]).join(", ")}.`);
    if (st[0] === "lost" && !has(i.reason)) throw new NeedInput("Why is it lost or disqualified?", [], "reason");
    const from = acqStageOf(d);
    const warning = acqRank(st[0]) > acqRank(from) ? acqPrereqGap(d, st[0]) : "";
    return { dealId: d.id, address: d.address, stage: st[0], label: st[1], pipeline: st[2], from, fromLabel: (ACQ_STAGES[ACQ_IDX[from]] || [])[1], warning, reason: has(i.reason) ? String(i.reason).slice(0, 200) : "", by: (meta.source || "manual") + (team.enabled ? " · " + roleLabel(team.role) : "") };
  },
  describe: i => `Set ${i.address} to "${i.label}"${i.pipeline && i.pipeline !== (S.deals.find(d => d.id === i.dealId) || {}).stage ? ` (pipeline: ${i.pipeline})` : ""}${i.warning ? `. Heads up: ${i.warning}` : ""}`,
  async run(i, ctx) {
    const d = S.deals.find(x => x.id === i.dealId);
    const nd = Object.assign({}, d, { acqStage: i.stage, updatedAt: nowIso() });
    const hist = { from: i.fromLabel || d.stage, to: i.label, at: nowIso(), by: i.by, why: i.reason || (i.warning ? "set without: " + i.warning : "") };
    nd.stageHistory = (d.stageHistory || []).concat([hist]).slice(-80);
    if (i.pipeline && STAGES.indexOf(i.pipeline) !== STAGES.indexOf(d.stage) && STAGES.indexOf(d.stage) < STAGES.indexOf("Buyer Secured")) nd.stage = i.pipeline;
    if (i.stage === "lost") { nd.archived = true; nd.archiveReason = i.reason; nd.archivedAt = today(); nd.nextFollowUp = ""; }
    if (i.stage === "nurture") { nd.nextFollowUp = nd.nextFollowUp && nd.nextFollowUp > today() ? nd.nextFollowUp : addDays(today(), S.settings.rules.notNow || 30); }
    await ctx.put("deals", nd);
    if (i.stage === "nurture" || nd.nextFollowUp !== d.nextFollowUp) await syncFollowUpTask(nd, ctx);
    return { stage: i.label, pipeline: nd.stage };
  },
  summary: (i, r) => `${i.address}: ${r.stage}${r.pipeline !== i.pipeline && i.pipeline ? "" : ""}.`
});
function acqStagesHTML(d) {
  const cur = acqStageOf(d);
  return `<div class="sec-title">Acquisition stage</div>
    <div class="acqsteps">${ACQ_STAGES.map(([k, l, p], i) => { const st = k === cur ? "cur" : ACQ_IDX[k] < ACQ_IDX[cur] && !["nurture", "lost"].includes(cur) && !["nurture", "lost"].includes(k) ? "done" : ""; return `<button class="acqstep ${st}" data-acqst="${k}" title="${p ? "Pipeline: " + p : ""}"><i>${k === "lost" || k === "nurture" ? 23 : i + 5}</i>${esc(l)}</button>`; }).join("")}</div>

}
